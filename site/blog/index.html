<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-L77MY6HN2G"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-L77MY6HN2G');
function gaEvt(name,params){params=params||{};params.language=localStorage.getItem('lang')||'en';gtag('event',name,params);}
</script>
<title>Blog — Rodrigo Matheus</title>
<meta name="description" content="Insights on engineering management, AI strategy, cloud architecture and fintech."/>
<meta name="theme-color" content="#0a0a0f"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
<link rel="manifest" href="/site.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
--bg:#0a0a0f;--surface:#111118;--surface-2:#16161f;
--text:#d4d4dc;--heading:#eeeef4;--muted:#6e6e82;--line:#1e1e2e;
--cyan:#00f0ff;--magenta:#ff2daa;--green:#39ff14;--amber:#f5a623;
--max:860px;
--mono:'Fira Code',monospace;--sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-size:14px;line-height:1.7;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden}
a{color:var(--cyan);text-decoration:none}
a:hover{opacity:.85}
::selection{background:var(--cyan);color:var(--bg)}

/* Matrix canvas */
#matrix-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.08}

/* Glow orbs */
.glow-orb{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
.glow-orb-1{width:600px;height:600px;top:-180px;left:-120px;background:var(--cyan);opacity:.05;animation:orbFloat 12s ease-in-out infinite alternate}
.glow-orb-2{width:500px;height:500px;bottom:-200px;right:-140px;background:var(--magenta);opacity:.04;animation:orbFloat 14s ease-in-out infinite alternate-reverse}
@keyframes orbFloat{to{transform:translate(20px,-18px)}}

/* Layout */
.container{width:min(var(--max),92vw);margin:0 auto}

/* Header */
.site-header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-row{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:12px}
.brand{font-family:var(--mono);font-weight:500;font-size:14px;color:var(--heading);text-decoration:none}
.brand span{color:var(--cyan)}
.header-nav{display:flex;align-items:center;gap:8px}
.header-nav a{font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;color:var(--muted);transition:color .2s,background .2s}
.header-nav a:hover{color:var(--cyan);background:var(--surface)}
.lang-btn{font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:border-color .25s,color .25s,box-shadow .25s}
.lang-btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px color-mix(in srgb,var(--cyan) 12%,transparent)}

/* Main */
main{position:relative;z-index:1;padding:32px 0 60px}

/* Blog list */
.blog-hero{margin-bottom:28px}
.blog-hero h1{font-family:var(--mono);font-size:clamp(22px,3vw,32px);color:var(--heading);letter-spacing:-.02em}
.blog-hero p{color:var(--muted);font-size:13px;margin-top:6px}
.blog-tags{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}
.blog-tag{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:all .25s;background:transparent}
.blog-tag:hover,.blog-tag.active{border-color:var(--cyan);color:var(--cyan);background:color-mix(in srgb,var(--cyan) 8%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--cyan) 10%,transparent)}

/* Post cards */
.post-list{display:flex;flex-direction:column;gap:14px}
.post-card{padding:20px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(4px);cursor:pointer;transition:border-color .25s,box-shadow .25s,transform .15s}
.post-card:hover{border-color:var(--cyan);box-shadow:0 0 20px color-mix(in srgb,var(--cyan) 12%,transparent);transform:translateY(-2px)}
.post-card-date{font-family:var(--mono);font-size:11px;color:var(--muted)}
.post-card h2{font-family:var(--mono);font-size:16px;color:var(--heading);margin-top:6px;line-height:1.3}
.post-card p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
.post-card-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.post-card-tags span{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.post-card-read{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-top:10px;display:inline-flex;align-items:center;gap:4px;text-transform:uppercase;letter-spacing:.04em}

/* Single post view */
.post-single{display:none}
.post-back{font-family:var(--mono);font-size:12px;color:var(--cyan);cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;transition:opacity .2s}
.post-back:hover{opacity:.7}
.post-header{margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.post-header h1{font-family:var(--mono);font-size:clamp(20px,3vw,28px);color:var(--heading);line-height:1.3;letter-spacing:-.01em}
.post-header .post-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.post-header .post-meta-tags{display:flex;gap:6px}
.post-header .post-meta-tags span{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}

/* Post body */
.post-body{font-size:15px;line-height:1.8;color:var(--text)}
.post-body h3{font-family:var(--mono);font-size:16px;color:var(--cyan);margin:28px 0 10px;letter-spacing:.02em}
.post-body p{margin-bottom:16px}
.post-body strong{color:var(--heading)}
.post-body code{font-family:var(--mono);font-size:13px;background:var(--surface-2);padding:2px 6px;border-radius:4px;color:var(--cyan)}
.post-body blockquote{border-left:3px solid var(--cyan);padding:8px 16px;margin:16px 0;color:var(--muted);background:color-mix(in srgb,var(--cyan) 4%,transparent);border-radius:0 8px 8px 0}

.no-posts{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center;padding:40px 0}

/* Footer */
.site-footer{padding:18px 0 30px;text-align:center;color:var(--muted);font-size:11px;font-family:var(--mono)}

/* Scrollbar */
::-webkit-scrollbar{width:6px;background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* Animations */
.reveal{opacity:0;transform:translateY(12px)}
.reveal.show{animation:rUp .5s ease forwards}
@keyframes rUp{to{opacity:1;transform:translateY(0)}}

@media(max-width:700px){.header-nav a.desktop-only{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;transform:none!important;opacity:1!important}}
</style>
</head>
<body>
<canvas id="matrix-bg" aria-hidden="true"></canvas>
<div class="glow-orb glow-orb-1" aria-hidden="true"></div>
<div class="glow-orb glow-orb-2" aria-hidden="true"></div>

<header class="site-header">
<div class="container header-row">
<a class="brand" href="/">rodrigo<span> matheus</span></a>
<div class="header-nav">
<a href="/" class="desktop-only" id="nav-home">Home</a>
<a href="/blog" id="nav-blog">Blog</a>
<button id="lang-toggle" class="lang-btn" aria-label="Switch language">EN</button>
</div>
</div>
</header>

<main class="container">

<!-- Blog list view -->
<div id="blog-list">
<div class="blog-hero">
<h1 id="blog-title">Blog</h1>
<p id="blog-subtitle">Thoughts on engineering, AI, leadership and building things that matter.</p>
</div>
<div class="blog-tags" id="tag-filters"></div>
<div class="post-list" id="post-list"></div>
</div>

<!-- Single post view -->
<div id="post-single" class="post-single">
<div class="post-back" id="post-back">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
<span id="back-label">Back to blog</span>
</div>
<div class="post-header" id="post-header"></div>
<div class="post-body" id="post-body"></div>
</div>

</main>

<footer class="site-footer"><p>rodrigo.matheus // engineering · ai · strategy</p></footer>

<script>
/* ── Matrix Rain ── */
(function(){
var c=document.getElementById("matrix-bg");
if(!c)return;
var ctx=c.getContext("2d"),W,H,cols,drops;
var chars="01アイウエオカキクケコサシスセソ";
var S=14;
function init(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;cols=Math.floor(W/S);drops=[];for(var i=0;i<cols;i++)drops[i]=1;}
function draw(){ctx.fillStyle="rgba(10,10,15,0.06)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#00f0ff";ctx.font=S+"px monospace";for(var i=0;i<cols;i++){var t=chars[Math.floor(Math.random()*chars.length)];ctx.fillText(t,i*S,drops[i]*S);if(drops[i]*S>H&&Math.random()>0.975)drops[i]=0;drops[i]++;}}
init();window.addEventListener("resize",init);setInterval(draw,50);
})();

/* ── Blog App ── */
(function(){
var _posts=[];
var _currentLang=localStorage.getItem("lang")||"en";
var _activeTag=null;

var listView=document.getElementById("blog-list");
var singleView=document.getElementById("post-single");
var postList=document.getElementById("post-list");
var tagFilters=document.getElementById("tag-filters");
var langBtn=document.getElementById("lang-toggle");

var i18n={
  en:{title:"Blog",subtitle:"Thoughts on engineering, AI, leadership and building things that matter.",all:"All",read:"Read →",back:"← Back to blog",home:"Home"},
  pt:{title:"Blog",subtitle:"Reflexões sobre engenharia, IA, liderança e construir coisas que importam.",all:"Todos",read:"Ler →",back:"← Voltar ao blog",home:"Início"}
};

function tx(){return i18n[_currentLang]||i18n.en;}

function safe(s){var d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML;}

function formatDate(d){
var dt=new Date(d+"T00:00:00");
var locale=_currentLang==="pt"?"pt-BR":"en-US";
return dt.toLocaleDateString(locale,{day:"numeric",month:"long",year:"numeric"});
}

function getAllTags(){
var tags={};
for(var i=0;i<_posts.length;i++){
var t=_posts[i].tags||[];
for(var j=0;j<t.length;j++)tags[t[j]]=true;
}
return Object.keys(tags).sort();
}

function renderTags(){
var tags=getAllTags();
var html='<span class="blog-tag active" data-tag="">'+safe(tx().all)+'</span>';
for(var i=0;i<tags.length;i++){
html+='<span class="blog-tag" data-tag="'+safe(tags[i])+'">'+safe(tags[i])+'</span>';
}
tagFilters.innerHTML=html;
}

function renderList(){
var lang=tx();
document.getElementById("blog-title").textContent=lang.title;
document.getElementById("blog-subtitle").textContent=lang.subtitle;
document.getElementById("nav-home").textContent=lang.home;
document.getElementById("back-label").textContent=lang.back;

var filtered=_posts;
if(_activeTag){
filtered=[];
for(var i=0;i<_posts.length;i++){
if(_posts[i].tags&&_posts[i].tags.indexOf(_activeTag)!==-1)filtered.push(_posts[i]);
}
}

if(!filtered.length){
postList.innerHTML='<div class="no-posts">No posts found.</div>';
return;
}

var html="";
for(var i=0;i<filtered.length;i++){
var p=filtered[i];
var t=p.i18n[_currentLang]||p.i18n.en;
var tagsHtml="";
for(var j=0;j<(p.tags||[]).length;j++){tagsHtml+='<span>'+safe(p.tags[j])+'</span>';}
html+='<article class="post-card reveal" data-slug="'+safe(p.slug)+'">'
+'<span class="post-card-date">'+safe(formatDate(p.date))+'</span>'
+'<h2>'+safe(t.title)+'</h2>'
+'<p>'+safe(t.summary)+'</p>'
+'<div class="post-card-tags">'+tagsHtml+'</div>'
+'<span class="post-card-read">'+safe(lang.read)+'</span>'
+'</article>';
}
postList.innerHTML=html;

/* Reveal animation */
var cards=postList.querySelectorAll(".reveal");
for(var i=0;i<cards.length;i++){
(function(el,delay){
setTimeout(function(){el.classList.add("show");},delay);
})(cards[i],i*80);
}
}

function showPost(slug){
var post=null;
for(var i=0;i<_posts.length;i++){if(_posts[i].slug===slug){post=_posts[i];break;}}
if(!post)return;

var t=post.i18n[_currentLang]||post.i18n.en;
var tagsHtml="";
for(var j=0;j<(post.tags||[]).length;j++){tagsHtml+='<span>'+safe(post.tags[j])+'</span>';}

document.getElementById("post-header").innerHTML=
'<h1>'+safe(t.title)+'</h1>'
+'<div class="post-meta"><span>'+safe(formatDate(post.date))+'</span><div class="post-meta-tags">'+tagsHtml+'</div></div>';

document.getElementById("post-body").innerHTML=t.body;

listView.style.display="none";
singleView.style.display="block";
window.scrollTo(0,0);
history.pushState({slug:slug},"","/blog/"+slug);
document.title=t.title+" — Rodrigo Matheus";

gaEvt("blog_post_view",{post_slug:slug,post_title:t.title});
}

function showList(){
listView.style.display="block";
singleView.style.display="none";
history.pushState({},"","/blog");
document.title="Blog — Rodrigo Matheus";
renderTags();
renderList();
}

function applyLang(){
var other=_currentLang==="pt"?"EN":"PT";
langBtn.textContent=other;
langBtn.title=_currentLang==="pt"?"English":"Português";
document.documentElement.lang=_currentLang==="pt"?"pt-BR":"en";

/* If viewing a post, re-render it */
if(singleView.style.display==="block"){
var slug=location.pathname.replace("/blog/","").replace("/blog","");
if(slug)showPost(slug);
}
renderTags();
renderList();
}

/* Event: language toggle */
langBtn.addEventListener("click",function(){
_currentLang=_currentLang==="pt"?"en":"pt";
localStorage.setItem("lang",_currentLang);
gaEvt("language_switch",{to_language:_currentLang});
applyLang();
});

/* Event: tag filter */
tagFilters.addEventListener("click",function(e){
var tag=e.target.closest(".blog-tag");
if(!tag)return;
_activeTag=tag.dataset.tag||null;
var all=tagFilters.querySelectorAll(".blog-tag");
for(var i=0;i<all.length;i++)all[i].classList.remove("active");
tag.classList.add("active");
gaEvt("blog_tag_filter",{tag:_activeTag||"all"});
renderList();
});

/* Event: post card click */
postList.addEventListener("click",function(e){
var card=e.target.closest(".post-card");
if(card)showPost(card.dataset.slug);
});

/* Event: back button */
document.getElementById("post-back").addEventListener("click",showList);

/* Browser back/forward */
window.addEventListener("popstate",function(){
var path=location.pathname;
if(path==="/blog"||path==="/blog/"){
showList();
}else{
var slug=path.replace("/blog/","");
if(slug)showPost(slug);
}
});

/* Load posts */
fetch("/blog/posts.json").then(function(r){
if(!r.ok)throw new Error(r.status);
return r.json();
}).then(function(data){
_posts=data;
/* Check if URL has a slug */
var path=location.pathname;
var slug=path.replace("/blog/","").replace("/blog","");
if(slug&&slug!=="/"){
showPost(slug);
}
applyLang();
}).catch(function(){
postList.innerHTML='<div class="no-posts">Failed to load posts.</div>';
});

})();
</script>
</body>
</html>
