    <!-- ?v= é o único jeito confiável de tirar o favicon antigo do Chrome: o cache
         dele é por URL. Suba o número sempre que o desenho mudar. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- LCP is the hero portrait; preload matches HeroPortrait's art direction exactly
         (wide crop >=768px, tall bust below) so the browser fetches one file, not two. -->
    <link rel="preload" as="image" media="(min-width: 768px)" fetchpriority="high"
          href="/hero/hero-wide-1280.webp"
          imagesrcset="/hero/hero-wide-1280.webp 1280w, /hero/hero-wide-1920.webp 1920w" imagesizes="100vw" />
    <link rel="preload" as="image" media="(max-width: 767px)" fetchpriority="high"
          href="/hero/hero-tall-900.webp"
          imagesrcset="/hero/hero-tall-640.webp 640w, /hero/hero-tall-900.webp 900w" imagesizes="100vw" />
